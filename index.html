<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepoWatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
    nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
    nav h1 { color: #58a6ff; font-size: 1.4em; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .btn-login { background: #238636; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: 600; }
    .btn-logout { background: #da3633; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
    .user-name { color: #58a6ff; font-weight: 600; }
    .hero { text-align: center; padding: 80px 20px 40px; }
    .hero h2 { font-size: 2.8em; font-weight: 700; margin-bottom: 16px; background: linear-gradient(90deg, #58a6ff, #79c0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: #8b949e; font-size: 1.1em; margin-bottom: 40px; }
    .search-box { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .search-box input { padding: 14px 20px; width: 360px; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: white; font-size: 1em; outline: none; }
    .search-box input:focus { border-color: #58a6ff; }
    .search-box button { padding: 14px 28px; background: #238636; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1em; font-weight: 600; }
    #result { max-width: 700px; margin: 40px auto; padding: 0 20px; display: none; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; }
    .card h2 { color: #58a6ff; font-size: 1.5em; margin-bottom: 20px; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .stat { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 20px; text-align: center; }
    .stat .number { font-size: 1.8em; font-weight: 700; color: #58a6ff; }
    .stat .label { color: #8b949e; font-size: 0.9em; margin-top: 4px; }
    .description { margin-top: 20px; padding: 16px; background: #0d1117; border-radius: 10px; color: #8b949e; border-left: 3px solid #58a6ff; }
    footer { text-align: center; padding: 40px; color: #8b949e; font-size: 0.9em; margin-top: 60px; border-top: 1px solid #30363d; }
  </style>
</head>
<body>
  <nav>
    <h1>🔭 RepoWatch</h1>
    <div class="nav-right">
      <span id="user-info" style="display:none">
        <span class="user-name" id="user-name"></span>
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </span>
      <button class="btn-login" id="btn-login" onclick="login()">🐙 Connexion GitHub</button>
    </div>
  </nav>
  <div class="hero">
    <h2>Analysez n'importe quel dépôt GitHub</h2>
    <p>Statistiques en temps réel • Gratuit • Instantané</p>
    <div class="search-box">
      <input id="repo" placeholder="ex: microsoft/vscode" onkeypress="if(event.key==='Enter')analyser()" />
      <button onclick="analyser()">🔍 Analyser</button>
    </div>
  </div>
  <div id="result"></div>
  <footer>© 2026 RepoWatch — Construit avec ❤️ par Barry</footer>

  <script>
    const supabase = window.supabase.createClient(
      'https://ivwbgknrdbijdavzvvac.supabase.co',
      'sb_publishable_KtbWTpoGfnuS_sDe2THrXw_8iQy_28b'
    );

    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        document.getElementById('user-info').style.display = 'flex';
        document.getElementById('user-info').style.alignItems = 'center';
        document.getElementById('user-info').style.gap = '10px';
        document.getElementById('btn-login').style.display = 'none';
        document.getElementById('user-name').textContent = '👤 ' + (user.user_metadata.user_name || user.email);
      }
    }

    async function login() {
      await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: 'https://oumbarry2999-del.github.io/repowatch' }
      });
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function analyser() {
      const repo = document.getElementById('repo').value.trim();
      if (!repo) { alert('Entrez un dépôt !'); return; }
      const result = document.getElementById('result');
      result.style.display = 'block';
      result.innerHTML = '<div style="text-align:center;color:#58a6ff;padding:40px">⏳ Chargement...</div>';
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}`);
        const data = await res.json();
        if (data.message) { result.innerHTML = '<div style="text-align:center;color:#f85149;padding:20px">❌ Dépôt introuvable !</div>'; return; }
        result.innerHTML = `
          <div class="card">
            <h2>📦 ${data.full_name}</h2>
            <div class="stats">
              <div class="stat"><div class="number">⭐ ${data.stargazers_count.toLocaleString()}</div><div class="label">Étoiles</div></div>
              <div class="stat"><div class="number">🍴 ${data.forks_count.toLocaleString()}</div><div class="label">Forks</div></div>
              <div class="stat"><div class="number">👁️ ${data.watchers_count.toLocaleString()}</div><div class="label">Watchers</div></div>
              <div class="stat"><div class="number">🐛 ${data.open_issues_count.toLocaleString()}</div><div class="label">Issues ouvertes</div></div>
            </div>
            <div class="description">📝 ${data.description || 'Aucune description'}</div>
          </div>`;
      } catch(e) {
        result.innerHTML = '<div style="text-align:center;color:#f85149;padding:20px">❌ Erreur de connexion !</div>';
      }
    }

    checkUser();
  </script>
</body>
</html>
