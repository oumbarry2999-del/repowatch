<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepoWatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #080d13; --surface: #0f1620; --border: #1e2d40; --accent: #3b82f6; --text: #e2eaf4; --muted: #6b7f96; --red: #ef4444; }
    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
    nav { background: rgba(15,22,32,0.9); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; }
    .btn-login { background: var(--accent); color: white; }
    .btn-logout { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid var(--red); }
    .hero { text-align: center; padding: 60px 20px; }
    .search-box { display: flex; gap: 10px; max-width: 500px; margin: 20px auto; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: white; }
    #result { max-width: 600px; margin: 0 auto; padding: 20px; }
    .error-msg { color: var(--red); background: rgba(239,68,68,0.1); padding: 15px; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>

  <nav>
    <h1 style="font-size: 1.2em;">🔭 RepoWatch</h1>
    <div id="auth-zone">
      <button class="btn btn-login" id="btn-login">Connecter GitHub</button>
      <div id="user-info" style="display:none; align-items:center; gap:10px;">
        <span id="user-name" style="font-family:'Space Mono'; font-size: 0.8em;"></span>
        <button class="btn btn-logout" id="btn-logout">Quitter</button>
      </div>
    </div>
  </nav>

  <div class="hero">
    <h2>Analysez un dépôt GitHub</h2>
    <div class="search-box">
      <input id="repo-input" placeholder="ex: facebook/react">
      <button class="btn btn-login" id="btn-analyser">Analyser</button>
    </div>
    <p id="status-text" style="font-size: 0.8em; color: var(--muted); margin-top: 10px;"></p>
  </div>

  <div id="result"></div>

  <script>
    // CONFIGURATION (Vérifie bien ces deux valeurs dans ton dashboard Supabase)
    const SUPABASE_URL = 'https://ivwbgknrdbijdavzvvac.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KtbWTpoGfnuS_sDe2THrXw_8iQy_28b';
    
    // URL actuelle sans les paramètres hash
    const REDIRECT_URL = window.location.origin + window.location.pathname;

    // --- INITIALISATION ---
    window.onload = () => {
      checkHash();
      checkUser();
    };

    // 1. Récupérer les tokens après redirection
    function checkHash() {
      const hash = window.location.hash;
      if (hash && hash.includes('access_token')) {
        const params = new URLSearchParams(hash.substring(1));
        localStorage.setItem('sb_token', params.get('access_token'));
        localStorage.setItem('gh_token', params.get('provider_token'));
        window.history.replaceState(null, null, window.location.pathname);
      }
    }

    // 2. Vérifier si l'utilisateur est loggé
    async function checkUser() {
      const token = localStorage.getItem('sb_token');
      const statusText = document.getElementById('status-text');
      
      if (!token) {
        statusText.innerText = "Mode invité (limité à 60 requêtes)";
        return;
      }

      try {
        const res = await fetch(${SUPABASE_URL}/auth/v1/user, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': Bearer ${token} }
        });
        if (res.ok) {
          const user = await res.json();
          showLoggedIn(user.user_metadata?.user_name || user.email);
        } else {
          logout();
        }
      } catch (e) {
        console.error("Erreur session:", e);
      }
    }

    function showLoggedIn(name) {
      document.getElementById('btn-login').style.display = 'none';
      document.getElementById('user-info').style.display = 'flex';
      document.getElementById('user-name').innerText = "👤 " + name;
      document.getElementById('status-text').innerText = "Connecté (5000 requêtes disponibles)";
    }

    function logout() {
      localStorage.clear();
      window.location.reload();
    }

    // --- ACTIONS ---

    // LE BOUTON DE CONNEXION (Correction du 404 ici)
    document.getElementById('btn-login').onclick = () => {
      // On s'assure que l'URL ne finit pas par un slash pour éviter le double //
      const baseUrl = SUPABASE_URL.replace(/\/$/, ""); 
      const authUrl = ${baseUrl}/auth/v1/authorize?provider=github&redirect_to=${encodeURIComponent(REDIRECT_URL)};
      
      console.log("Tentative de redirection vers:", authUrl);
      window.location.href = authUrl;
    };

    document.getElementById('btn-logout').onclick = logout;

    // L'ANALYSEUR
    document.getElementById('btn-analyser').onclick = async () => {
      const repo = document.getElementById('repo-input').value.trim();
      if (!repo) return;

      const result = document.getElementById('result');
      result.innerHTML = "Chargement...";

      try {
        const ghToken = localStorage.getItem('gh_token');
        const headers = ghToken ? { 'Authorization': token ${ghToken} } : {};
        
        const res = await fetch(https://api.github.com/repos/${repo}, { headers });
        const data = await res.json();

        if (!res.ok) throw new Error(data.message);

        result.innerHTML = `
          <div style="background:var(--surface); padding:20px; border-radius:12px; border:1px solid var(--border);">
            <h3>${data.full_name}</h3>
            <p>${data.description || ''}</p>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
              <div style="background:var(--bg); padding:10px; border-radius:5px;">⭐ Stars: ${data.stargazers_count}</div>
              <div style="background:var(--bg); padding:10px; border-radius:5px;">🍴 Forks: ${data.forks_count}</div>
            </div>
          </div>`;
      } catch (e) {
        result.innerHTML = <div class="error-msg">Erreur: ${e.message}</div>;
      }
    };
  </script>
</body>
</html>
