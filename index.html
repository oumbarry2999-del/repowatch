
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>RepoWatch</title>
  <style>
    body { font-family: Arial; background: #0d1117; color: white; text-align: center; padding: 50px; }
    h1 { color: #58a6ff; font-size: 3em; }
    p { color: #8b949e; font-size: 1.2em; }
    input { padding: 10px; width: 300px; border-radius: 8px; border: none; margin: 10px; }
    button { padding: 10px 20px; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; }
    #result { margin-top: 30px; background: #161b22; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>🔭 RepoWatch</h1>
  <p>Surveillez vos dépôts GitHub en temps réel</p>
  <input id="repo" placeholder="ex: microsoft/vscode" />
  <button onclick="analyser()">Analyser</button>
  <div id="result"></div>
  <script>
    async function analyser() {
      const repo = document.getElementById('repo').value;
      const res = await fetch(`https://api.github.com/repos/${repo}`);
      const data = await res.json();
      document.getElementById('result').innerHTML = `
        <h2>${data.full_name}</h2>
        <p>⭐ Étoiles : ${data.stargazers_count}</p>
        <p>🍴 Forks : ${data.forks_count}</p>
        <p>👁️ Watchers : ${data.watchers_count}</p>
        <p>🐛 Issues ouvertes : ${data.open_issues_count}</p>
        <p>📝 Description : ${data.description}</p>
      `;
    }
  </script>
</body>
</html>
